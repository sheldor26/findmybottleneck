[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findmybottleneck"
version = "0.1.0"
description = "Finds the actual bottleneck on your PC: measured on your machine while you play, not calculated from a spec sheet."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Juan Mirande" }]
keywords = ["gaming", "performance", "bottleneck", "fps", "frametime", "presentmon", "nvidia", "diagnostics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Topic :: System :: Benchmark",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sheldor26/findmybottleneck"

[project.scripts]
findmybottleneck = "findmybottleneck.cli:main"
# The honest name is long to type, so the short one is there too.
fmb = "findmybottleneck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["findmybottleneck"]
